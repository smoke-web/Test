<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кофе-Ремонт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1b120c; --fg:#ffe9cf; --accent:#ffb347; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:radial-gradient(circle at 50% 30%, #3a2416, var(--bg) 70%); color:var(--fg);
    font-family: Rubik, system-ui, sans-serif; overflow:hidden; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px 16px; }
  #frame { position:relative; width:min(calc(100vw - 32px), calc((100vh - 84px) * 0.5625)); }
  #screen { display:block; width:100%; height:auto; aspect-ratio:9/16; border-radius:16px; background:#000;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,200,140,.15); cursor:pointer; }
  #bar { position:absolute; left:12px; right:12px; bottom:8px; height:4px; border-radius:2px; background:rgba(255,255,255,.18); overflow:hidden; pointer-events:none; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); }
  #controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { font:600 14px Rubik, system-ui, sans-serif; color:#2a1608; background:var(--accent); border:0; border-radius:999px;
    padding:9px 16px; cursor:pointer; box-shadow:0 4px 14px rgba(255,160,60,.25); }
  button.ghost { background:rgba(255,220,180,.12); color:var(--fg); box-shadow:none; }
  button:disabled { opacity:.6; cursor:default; }
  #err { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:15px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="screen" width="720" height="1280"></canvas>
    <div id="bar"><i></i></div>
    <div id="err">Не удалось загрузить three.js — нужен интернет (cdn.jsdelivr.net).</div>
  </div>
  <div id="controls">
    <button id="bPlay" class="ghost">⏸ Пауза</button>
    <button id="bRestart" class="ghost">⟲ Заново</button>
    <button id="bRec">⏺ Записать видео 30 с</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.__threeLoaded = true;

// ───────────────────────────── базовое ─────────────────────────────
const W = 720, H = 1280, DUR = 30;
const out = document.getElementById('screen');
const ctx = out.getContext('2d');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b1a10);
scene.fog = new THREE.Fog(0x3b2416, 9, 18);

const camera = new THREE.PerspectiveCamera(56, W / H, 0.05, 60);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// утилиты
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const pulse = (a, b, c, d, t) => ss(a, b, t) * (1 - ss(c, d, t));
const hop = (t, a, dur, h) => (t > a && t < a + dur) ? h * 4 * ((t - a) / dur) * (1 - (t - a) / dur) : 0;
const backOut = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const std = (color, roughness = 0.6, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const chrome = std(0xe8e2da, 0.22, 1, { envMap: envTex, envMapIntensity: 1.1 });
const brass = std(0xd7a64a, 0.3, 1, { envMap: envTex, envMapIntensity: 1.0 });
const darkMetal = std(0x2a2a2e, 0.4, 0.6, { envMap: envTex, envMapIntensity: 0.5 });
const blackRubber = std(0x1d1a18, 0.8);

function mesh(geo, mat, parent, x = 0, y = 0, z = 0, cast = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true; if (parent) parent.add(m); return m;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

// ───────────────────────────── кухня ─────────────────────────────
{
  const floorTex = canvasTex(256, 256, (g, w, h) => {
    const cols = ['#c8774a', '#ecd2a8'];
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = cols[(i + j) % 2]; g.fillRect(i * 128, j * 128, 128, 128); }
    g.strokeStyle = 'rgba(80,40,20,.35)'; g.lineWidth = 4; g.strokeRect(0, 0, 256, 256);
    g.beginPath(); g.moveTo(128, 0); g.lineTo(128, 256); g.moveTo(0, 128); g.lineTo(256, 128); g.stroke();
  }, [9, 9]);
  const floor = mesh(new THREE.PlaneGeometry(14, 14), std(0xffffff, 0.55, 0, { map: floorTex }), scene, 0, 0, 0, false);
  floor.rotation.x = -Math.PI / 2;

  const tileTex = canvasTex(256, 256, (g) => {
    g.fillStyle = '#d6c09c'; g.fillRect(0, 0, 256, 256);
    for (let r = 0; r < 8; r++) for (let c = -1; c < 4; c++) {
      const x = c * 80 + (r % 2) * 40, y = r * 32;
      g.fillStyle = r % 3 === 0 ? '#f6e8cf' : '#f2e2c4'; g.fillRect(x + 3, y + 3, 74, 26);
    }
  }, [5, 2]);
  mesh(new THREE.PlaneGeometry(14, 2.0), std(0xffffff, 0.35, 0, { map: tileTex }), scene, 0, 1.0, -2.2, false);
  mesh(new THREE.PlaneGeometry(14, 6), std(0xd98457, 0.9), scene, 0, 5.0, -2.2, false);
  mesh(new THREE.BoxGeometry(14, 0.08, 0.06), std(0x7a4a2e, 0.6), scene, 0, 2.02, -2.17);

  // окно с закатом
  const sky = canvasTex(256, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#ff9a5a'); gr.addColorStop(0.55, '#ffc173'); gr.addColorStop(1, '#ff7f6a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const s = g.createRadialGradient(150, 175, 5, 150, 175, 70); s.addColorStop(0, '#fff6d0'); s.addColorStop(0.35, '#ffe08a'); s.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = s; g.fillRect(0, 0, w, h);
    g.fillStyle = '#b85a4a'; g.beginPath(); g.moveTo(0, 230);
    for (let x = 0; x <= 256; x += 16) g.lineTo(x, 205 + Math.sin(x * 0.05) * 14 + Math.sin(x * 0.13) * 6); g.lineTo(256, 256); g.lineTo(0, 256); g.fill();
  });
  const win = new THREE.Group(); win.position.set(-1.55, 2.85, -2.18); scene.add(win);
  mesh(new THREE.PlaneGeometry(1.3, 1.1), new THREE.MeshBasicMaterial({ map: sky }), win, 0, 0, 0, false);
  const fm = std(0xfff2e0, 0.5);
  mesh(new THREE.BoxGeometry(1.45, 0.08, 0.08), fm, win, 0, 0.59, 0.03); mesh(new THREE.BoxGeometry(1.45, 0.1, 0.14), fm, win, 0, -0.6, 0.05);
  mesh(new THREE.BoxGeometry(0.08, 1.25, 0.08), fm, win, -0.69, 0, 0.03); mesh(new THREE.BoxGeometry(0.08, 1.25, 0.08), fm, win, 0.69, 0, 0.03);
  mesh(new THREE.BoxGeometry(0.04, 1.1, 0.04), fm, win, 0, 0, 0.03); mesh(new THREE.BoxGeometry(1.3, 0.04, 0.04), fm, win, 0, 0.05, 0.03);

  // столешницы
  const cab = std(0x7d4b2c, 0.7), top = std(0xe2bd8f, 0.45);
  for (const sx of [-1, 1]) {
    mesh(new THREE.BoxGeometry(3, 0.95, 0.66), cab, scene, sx * 2.6, 0.475, -1.86);
    mesh(new THREE.BoxGeometry(3.06, 0.07, 0.72), top, scene, sx * 2.6, 0.985, -1.84);
    for (let k = 0; k < 3; k++) mesh(new THREE.BoxGeometry(0.9, 0.78, 0.02), std(0x8f5a37, 0.6), scene, sx * (1.6 + k * 1.0), 0.48, -1.52);
    for (let k = 0; k < 3; k++) mesh(new THREE.BoxGeometry(0.16, 0.03, 0.04), brass, scene, sx * (1.6 + k * 1.0), 0.78, -1.5);
  }
  // растение
  mesh(new THREE.CylinderGeometry(0.14, 0.11, 0.24, 20), std(0xe0663f, 0.6), scene, -1.45, 1.14, -1.85);
  const leaf = std(0x4f9a4a, 0.6);
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2;
    const l = mesh(new THREE.SphereGeometry(0.09, 12, 8), leaf, scene, -1.45 + Math.cos(a) * 0.09, 1.36 + (i % 3) * 0.06, -1.85 + Math.sin(a) * 0.09); l.scale.set(1, 1.6, 0.6); l.rotation.z = Math.cos(a) * 0.6; }
  // банка с зёрнами и кружки
  mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.3, 20), std(0xffffff, 0.1, 0, { transparent: true, opacity: 0.35 }), scene, -2.1, 1.17, -1.9);
  mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.22, 20), std(0x4a2a17, 0.8), scene, -2.1, 1.13, -1.9);
  mesh(new THREE.CylinderGeometry(0.125, 0.125, 0.05, 20), std(0xcf7a3a, 0.5), scene, -2.1, 1.34, -1.9);
  const mugCols = [0xf2efe8, 0x5fb3a3, 0xe86f4a];
  mugCols.forEach((c, i) => mesh(new THREE.CylinderGeometry(0.075, 0.07, 0.15, 18), std(c, 0.4), scene, 1.4 + i * 0.22, 1.095, -1.9));
  // полка
  mesh(new THREE.BoxGeometry(1.3, 0.05, 0.3), std(0x8a5534, 0.6), scene, 1.7, 2.55, -2.05);
  mugCols.forEach((c, i) => mesh(new THREE.CylinderGeometry(0.07, 0.065, 0.14, 18), std(c, 0.4), scene, 1.3 + i * 0.3, 2.645, -2.03));
  mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.26, 18), std(0xf0c040, 0.5), scene, 2.2, 2.705, -2.03);
  // часы
  const clock = new THREE.Group(); clock.position.set(0.95, 3.35, -2.17); scene.add(clock);
  const cf = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.05, 32), std(0xfff3dc, 0.5), clock); cf.rotation.x = Math.PI / 2;
  const cr = mesh(new THREE.TorusGeometry(0.26, 0.03, 10, 32), brass, clock);
  const h1 = mesh(new THREE.BoxGeometry(0.02, 0.15, 0.01), blackRubber, clock, 0.04, 0.05, 0.035); h1.rotation.z = -0.7;
  const h2 = mesh(new THREE.BoxGeometry(0.015, 0.2, 0.01), blackRubber, clock, -0.05, -0.07, 0.04); h2.rotation.z = 2.5;
}

// лампа
const lampG = new THREE.Group(); lampG.position.set(0.45, 3.05, -0.35); scene.add(lampG);
mesh(new THREE.CylinderGeometry(0.008, 0.008, 3, 6), blackRubber, lampG, 0, 1.6, 0, false);
const shade = mesh(new THREE.ConeGeometry(0.28, 0.24, 28, 1, true), std(0xe8763e, 0.5, 0, { side: THREE.DoubleSide }), lampG, 0, 0.1, 0, false);
const bulbMat = new THREE.MeshStandardMaterial({ color: 0xfff1d0, emissive: 0xffc070, emissiveIntensity: 3 });
mesh(new THREE.SphereGeometry(0.07, 16, 12), bulbMat, lampG, 0, -0.02, 0, false);

// ───────────────────────────── свет ─────────────────────────────
const hemi = new THREE.HemisphereLight(0xffe2b8, 0x5a3a22, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb36b, 2.6); sun.position.set(-3.5, 5.5, 3.5);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 }); sun.shadow.bias = -0.0006; sun.shadow.radius = 4;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xff8a5a, 1.6); rim.position.set(2.5, 3, -4); scene.add(rim);
const front = new THREE.DirectionalLight(0xffe6c8, 0.7); front.position.set(0.5, 1.6, 6); scene.add(front);
const lampLight = new THREE.PointLight(0xffc27a, 9, 9, 1.6); lampLight.position.set(0.45, 2.9, -0.35); scene.add(lampLight);
const flashLight = new THREE.PointLight(0xfff0d0, 0, 12, 1.5); flashLight.position.set(0, 1.9, -0.6); scene.add(flashLight);
const sparkLight = new THREE.PointLight(0xffa040, 0, 3, 2); scene.add(sparkLight);

// ───────────────────────────── кофемашина ─────────────────────────────
const machine = new THREE.Group(); machine.position.set(0, 0, -0.85); scene.add(machine);
const mBody = new THREE.Group(); machine.add(mBody);
const red = std(0xc63c2a, 0.32, 0.1, { envMap: envTex, envMapIntensity: 0.35 });
mesh(new RoundedBoxGeometry(1.3, 0.12, 0.85, 3, 0.04), chrome, mBody, 0, 0.06, 0);
mesh(new RoundedBoxGeometry(1.15, 1.35, 0.75, 5, 0.1), red, mBody, 0, 0.795, 0);
mesh(new RoundedBoxGeometry(0.78, 0.5, 0.12, 3, 0.04), std(0x2a1d18, 0.5), mBody, 0, 0.45, 0.33);
mesh(new RoundedBoxGeometry(0.8, 0.05, 0.32, 2, 0.02), chrome, mBody, 0, 0.17, 0.4);
mesh(new THREE.CylinderGeometry(0.11, 0.1, 0.13, 24), chrome, mBody, 0, 0.8, 0.44);
const porta = new THREE.Group(); porta.position.set(0, 0.7, 0.46); mBody.add(porta);
mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.07, 24), chrome, porta);
const handle = mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.36, 12), blackRubber, porta, 0.12, -0.02, 0.15); handle.rotation.set(Math.PI / 2, 0, -0.65);
mesh(new RoundedBoxGeometry(1.17, 0.07, 0.77, 2, 0.03), chrome, mBody, 0, 1.0, 0); // хромовая полоса
// манометр
const gauge = new THREE.Group(); gauge.position.set(-0.13, 1.2, 0.385); mBody.add(gauge);
const gRim = mesh(new THREE.TorusGeometry(0.15, 0.025, 12, 40), chrome, gauge);
mesh(new THREE.CircleGeometry(0.15, 40), std(0xfff8ea, 0.4), gauge, 0, 0, -0.005, false);
const redZone = mesh(new THREE.RingGeometry(0.1, 0.14, 32, 1, -0.55, 1.05), new THREE.MeshBasicMaterial({ color: 0xe23b2b }), gauge, 0, 0, 0.002, false);
const greenZone = mesh(new THREE.RingGeometry(0.1, 0.14, 32, 1, 0.6, 1.4), new THREE.MeshBasicMaterial({ color: 0x55b26a }), gauge, 0, 0, 0.002, false);
const needle = new THREE.Group(); needle.position.z = 0.01; gauge.add(needle);
mesh(new THREE.BoxGeometry(0.012, 0.12, 0.006), std(0x222222, 0.4), needle, 0, 0.055, 0, false);
mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.02, 16), chrome, gauge, 0, 0, 0.012, false).rotation.x = Math.PI / 2;
// кнопки-лампочки
const leds = [0x55ff7a, 0xffa030].map((c, i) => {
  const m = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: c, emissiveIntensity: 1 });
  const o = mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.04, 20), m, mBody, 0.2 + i * 0.16, 1.22, 0.385); o.rotation.x = Math.PI / 2;
  return m;
});
// паровая трубка
const wand = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 10), chrome, mBody, 0.5, 0.68, 0.3); wand.rotation.z = 0.15;
// крышка (улетит)
const lid = new THREE.Group(); lid.position.set(0, 1.535, 0); machine.add(lid);
mesh(new RoundedBoxGeometry(1.02, 0.12, 0.66, 3, 0.04), chrome, lid);
mesh(new THREE.SphereGeometry(0.07, 16, 12), std(0x1d1a18, 0.4), lid, 0, 0.09, 0);
// маленькие чашки на крышке
const topCups = [-0.3, 0.3].map(x => mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.1, 16), std(0xfff6ea, 0.35), lid, x, 0.11, 0.05));

// ───────────────────────────── герои ─────────────────────────────
const gloveMat = std(0x2b2724, 0.7);
const eyeWhite = std(0xffffff, 0.15);
const darkMouth = std(0x3a1410, 0.7);
const foamMat = new THREE.MeshStandardMaterial({ color: 0xfffaf2, roughness: 0.45, emissive: 0x6a5040, emissiveIntensity: 0.3 });
const coffeeMat = std(0x5a3018, 0.3);

function makeEye(R, skin, irisColor) {
  const g = new THREE.Group();
  mesh(new THREE.TorusGeometry(R, R * 0.27, 14, 36), brass, g);
  const back = mesh(new THREE.CylinderGeometry(R * 1.02, R * 1.02, R * 0.5, 32), darkMetal, g, 0, 0, -R * 0.2); back.rotation.x = Math.PI / 2;
  const ball = new THREE.Group(); g.add(ball);
  mesh(new THREE.SphereGeometry(R * 0.92, 32, 16), eyeWhite, ball).scale.z = 0.55;
  const look = new THREE.Group(); look.position.z = R * 0.92 * 0.55 - 0.004; ball.add(look);
  mesh(new THREE.CircleGeometry(R * 0.44, 32), std(irisColor, 0.3), look, 0, 0, 0, false);
  mesh(new THREE.CircleGeometry(R * 0.23, 24), std(0x0a0a0a, 0.2), look, 0, 0, 0.002, false);
  mesh(new THREE.CircleGeometry(R * 0.09, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }), look, R * 0.13, R * 0.14, 0.004, false);
  const lidM = mesh(new THREE.SphereGeometry(R * 0.96, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), skin, g);
  lidM.scale.y = 0.6;
  // стекло очков
  mesh(new THREE.SphereGeometry(R * 0.98, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, transparent: true, opacity: 0.12, envMap: envTex }), g, 0, 0, 0.01, false)
    .rotation.x = Math.PI / 2;
  return { g, ball, look, lid: lidM, R };
}

function makeBuddy(o) {
  const root = new THREE.Group(); scene.add(root);
  const skin = new THREE.MeshPhysicalMaterial({ color: o.color, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.5 });
  const pants = std(o.pants, 0.85);
  const b = { root, skin };
  // ноги
  b.legs = [-1, 1].map(s => {
    const p = new THREE.Group(); p.position.set(s * 0.16, 0.22, 0); root.add(p);
    mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.2, 14), pants, p, 0, -0.1, 0);
    mesh(new THREE.SphereGeometry(0.1, 18, 12), blackRubber, p, 0, -0.17, 0.04).scale.set(1, 0.6, 1.45);
    return p;
  });
  const torso = new THREE.Group(); torso.position.y = 0.2; root.add(torso); b.torso = torso;
  const body = mesh(new THREE.CapsuleGeometry(0.42, 0.55, 14, 40), skin, torso, 0, 0.695, 0);
  // штаны + нагрудник
  mesh(new THREE.SphereGeometry(0.434, 36, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), pants, torso, 0, 0.42, 0);
  mesh(new THREE.CylinderGeometry(0.434, 0.434, 0.16, 36, 1, true), pants, torso, 0, 0.5, 0);
  mesh(new THREE.CylinderGeometry(0.434, 0.434, 0.12, 36, 1, true, -0.55, 1.1), pants, torso, 0, 0.6, 0);
  mesh(new RoundedBoxGeometry(0.16, 0.11, 0.03, 2, 0.01), std(o.pocket, 0.8), torso, 0, 0.58, 0.43);
  for (const s of [-1, 1]) mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.02, 12), brass, torso, s * 0.2, 0.63, 0.39).rotation.x = Math.PI / 2;
  // ремешок очков
  mesh(new THREE.CylinderGeometry(0.432, 0.432, 0.1, 40, 1, true), std(0x2d2622, 0.7, 0, { side: THREE.DoubleSide }), torso, 0, 1.04, 0);
  // глаза
  b.eyes = [];
  const ex = o.eyes === 1 ? [0] : [-0.155, 0.155];
  const R = o.eyes === 1 ? 0.18 : 0.135;
  for (const x of ex) {
    const e = makeEye(R, skin, o.iris);
    const zz = Math.sqrt(0.42 * 0.42 - x * x) - 0.005;
    e.g.position.set(x, 1.04, zz); e.g.rotation.y = Math.asin(x / 0.42);
    torso.add(e.g); b.eyes.push(e);
  }
  // рот
  const smile = mesh(new THREE.TorusGeometry(0.085, 0.019, 8, 24, Math.PI), darkMouth, torso, 0, 0.765, 0.415, false);

function applyBuddy(b, s) {
  b.root.position.set(s.x, s.y, s.z);
  b.root.rotation.y = s.ry;
  b.torso.rotation.set(s.lean, 0, s.tilt);
  const sq = s.squash; b.torso.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  b.arms[0].p.rotation.set(s.aRx, 0, s.aRz);
  b.arms[1].p.rotation.set(s.aLx, 0, s.aLz);
  b.legs[0].rotation.x = s.walk; b.legs[1].rotation.x = -s.walk;
  b.eyes.forEach((e, i) => {

    const close = clamp(Math.max(s.close, i === 0 ? s.wink : 0));
    e.lid.rotation.x = lerp(-Math.PI / 2 - 0.25, Math.PI / 2, close);
    e.look.position.x = s.lx * e.R * 0.32; e.look.position.y = s.ly * e.R * 0.32;

  b.teeth.visible = m > 0.3 && s.smile > 0.2;

}

}

  }

  // субтитры
  const sub = SUBS.find(s => t >= s[0] && t < s[1]);
  if (sub) {
    const [a, b, who, text] = sub;
    const k = ss(a, a + 0.18, t) * (1 - ss(b - 0.18, b, t));
    ctx.save(); ctx.globalAlpha = k; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (!who) {
      // звуковой эффект
      ctx.translate(W / 2 + Math.sin(t * 60) * 6 * (1 - ss(15, 16, t)), 1010); const s = backOut(ss(a, a + 0.3, t)) * 1.0; ctx.scale(s, s); ctx.rotate(-0.06);
      ctx.font = `900 92px ${FONT}`; ctx.lineJoin = 'round'; ctx.lineWidth = 16; ctx.strokeStyle = '#5a2a0e'; ctx.strokeText(text, 0, 0);
      const g = ctx.createLinearGradient(0, -40, 0, 40); g.addColorStop(0, '#fff6d8'); g.addColorStop(1, '#ffb347');
      ctx.fillStyle = g; ctx.fillText(text, 0, 0);
    } else {
      ctx.font = `800 40px ${FONT}`;
      const lines = wrap(text, 600);
      const lh = 50, bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 56, bh = lines.length * lh + 30;
      const by = 1150 - bh, bx = W / 2 - bw / 2;
      const pop = 0.92 + 0.08 * backOut(ss(a, a + 0.25, t));
      ctx.translate(W / 2, by + bh / 2); ctx.scale(pop, pop); ctx.translate(-W / 2, -(by + bh / 2));
      ctx.fillStyle = 'rgba(24,12,4,0.62)'; rr(bx, by, bw, bh, 22); ctx.fill();
      // плашка с именем
      ctx.font = `800 24px ${FONT}`;
      const nw = ctx.measureText(who).width + 30;
      ctx.fillStyle = NAMECOL[who]; rr(bx + 18, by - 20, nw, 36, 18); ctx.fill();
      ctx.fillStyle = '#2a1608'; ctx.fillText(who, bx + 18 + nw / 2, by - 1);
      ctx.font = `800 40px ${FONT}`; ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      lines.forEach((l, i) => { const y = by + 15 + lh / 2 + i * lh + 4; ctx.strokeText(l, W / 2, y); ctx.fillStyle = '#fff6e8'; ctx.fillText(l, W / 2, y); });
    }
    ctx.restore();
  }
}

// ───────────────────────────── кадр ─────────────────────────────
function renderAt(t) {
  t = clamp(t, 0, DUR - 0.0001);
  applyBuddy(bobo, boboState(t));
  applyBuddy(tiki, tikiState(t));
  updateMachine(t);
  scene.updateMatrixWorld();
  updateEffects(t);
  updateCamera(t);
  renderer.render(scene, camera);
  drawOverlay(t);
  barFill.style.width = (t / DUR * 100).toFixed(2) + '%';
}

// ───────────────────────────── плеер и запись ─────────────────────────────
const barFill = document.querySelector('#bar i');
const bPlay = document.getElementById('bPlay'), bRestart = document.getElementById('bRestart'), bRec = document.getElementById('bRec');
let playing = true, startAt = performance.now(), cur = 0, recorder = null;

function setPlaying(p) { playing = p; if (p) startAt = performance.now() - cur * 1000; bPlay.textContent = p ? '⏸ Пауза' : '▶ Смотреть'; }
function restart() { cur = 0; startAt = performance.now(); setPlaying(true); }
out.addEventListener('click', () => setPlaying(!playing));
bPlay.addEventListener('click', () => setPlaying(!playing));
bRestart.addEventListener('click', restart);
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } });

bRec.addEventListener('click', () => {
  if (recorder) return;
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = types.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) { alert('Браузер не поддерживает запись видео (MediaRecorder).'); return; }
  const stream = out.captureStream(30);
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'kofe-remont.' + (mime.includes('mp4') ? 'mp4' : 'webm'); a.click();
    recorder = null; bRec.disabled = false; bRec.textContent = '⏺ Записать видео 30 с';
  };
  restart(); recorder.start(); bRec.disabled = true; bRec.textContent = '● Идёт запись…';
});

function loop(now) {
  if (playing) {
    cur = (now - startAt) / 1000;
    if (cur >= DUR) {
      if (recorder && recorder.state === 'recording') { renderAt(DUR); recorder.stop(); }
      cur = 0; startAt = now;
    }
  }
  renderAt(cur);
  if (!window.__manual) requestAnimationFrame(loop);
}

// для отладки: window.__seek(секунды)
window.__seek = (t) => { window.__manual = true; playing = false; cur = t; renderAt(t); };

(document.fonts ? document.fonts.load(`800 40px Rubik`).catch(() => {}) : Promise.resolve()).finally(() => requestAnimationFrame(loop));
</script>
<script>
  setTimeout(() => { if (!window.__threeLoaded) document.getElementById('err').style.display = 'flex'; }, 8000);
</script>
